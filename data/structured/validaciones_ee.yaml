# Correcciones y confirmaciones de la revisión manual de los programas de EE.
# scripts/extract_ee.py las aplica sobre lo extraído de los PDF, así sobreviven a una nueva
# extracción. Las claves son el nombre de la EE tal como aparece en su programa.
#
#   prerrequisitos: []          -> confirmado: no tiene prerrequisitos (aunque el PDF venga vacío)
#   recomendadas: [EE, ...]     -> se recomienda cursarlas antes; NO es requisito obligatorio
#   confirmado: [marca, ...]    -> marcas de `revisar` revisadas y correctas tal como están
#   nota: "..."                 -> aclaración PARA EL ESTUDIANTE: el chatbot la muestra siempre
#                                  (la procedencia de cada dato va en comentarios, no en la nota)
#   area: disciplinar           -> área confirmada (prevalece sobre el PDF y el mapa curricular)
#   nombre: "..."               -> nombre corregido (p. ej. una errata del PDF); cambia la clave
#
# Regla general (revisión del 2026-11-22): para todas las EE la recomendación es cursarlas en
# el periodo que marca el mapa curricular (se aplica al cruzar con el mapa, paso 2).

Administración de Servidores:
  prerrequisitos: []
  recomendadas: [Networking]

Ciberseguridad Aplicada:
  prerrequisitos: []
  recomendadas: [Principios de Ciberseguridad]

Procesos de Desarrollo de Software:
  prerrequisitos: []

Tecnologías para la Integración de Soluciones:
  prerrequisitos: []

Prácticas Profesionales:
  confirmado: [horas_totales_no_cuadran]
  # Valores del programa confirmados (2026-11-22).
  nota: "Incluye 120 horas de prácticas profesionales."

Servicio Social:
  confirmado: [creditos_no_cuadran_con_horas]
  nota: "480 horas comprobables por medio de reportes mensuales."

Liderazgo y Emprendimiento:
  confirmado: [horas_totales_no_cuadran]  # 75 horas totales, como indica el programa (2026-11-22)

Experiencia Recepcional:
  confirmado: [creditos_no_cuadran_con_horas]

# El mapa curricular la marca como iniciacion_disciplina; vale el programa (revisión 2026-11-22).
Bases de Datos Relacionales:
  area: disciplinar

# Totales oficiales por área (coordinación, 2026-11-22): básica 20, iniciación a la disciplina 57,
# disciplinar 213, terminal 52, elección libre 18 (total 360). Con las áreas de los programas,
# iniciación suma exactamente 57; con las del mapa sumaría 91. Vale el programa.
Administración de Bases de Datos:
  area: disciplinar
Bases de Datos Post-Relacionales:
  area: disciplinar
Ingeniería de datos:
  area: disciplinar

# Terminal: 52 oficiales - 46 de las demás EE terminales (con 3 optativas de 6) = 6.
