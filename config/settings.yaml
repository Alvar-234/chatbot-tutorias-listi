# Configuración central. Cambiar proveedor, modelo o umbrales NO requiere tocar código (RNF6).
# Los valores marcados con REEMPLAZAR deben definirse tras verificar el catálogo vigente (sección 3.2).

llm:
  temperature: 0.0
  max_tokens: 1500            # en modelos de razonamiento incluye el "pensamiento"; si se agota, la respuesta se descarta
  timeout_s: 30
  retry_429_max_wait_s: 10    # ante límite de cuota (429) espera el retry-after si es <= a esto; si no, pasa al siguiente
  # Cadena de contingencia (sección 3.4): se prueba en orden; si uno falla, pasa al siguiente.
  # `extra` se envía tal cual en el cuerpo de la petición (parámetros propios del proveedor).
  chain:
    - provider: nvidia        # groq | huggingface | nvidia | local
      model: "nvidia/nemotron-3.5-lightning-30b-a3b"   # ver build.nvidia.com/models
      extra:
        chat_template_kwargs: {enable_thinking: false}  # sin razonamiento: más rápido y sin agotar max_tokens
    - provider: groq
      model: "openai/gpt-oss-20b"    # ver https://console.groq.com/docs/models (nivel gratuito)
      extra:
        reasoning_effort: "low"
    - provider: local
      model: "llama3.2"     # p. ej. un modelo servido por Ollama
      base_url: "http://localhost:11434/v1"

embeddings:
  # provider: local -> `model` en este equipo; nvidia -> `nvidia_model` por API (NVIDIA_API_KEY).
  # Cada proveedor tiene su propia colección en Chroma: al cambiarlo, reconstruye el índice una vez.
  provider: nvidia
  nvidia_model: "nvidia/nemotron-3.5-embed-1b"   # multilingüe, 2048 dimensiones
  model: "BAAI/bge-m3"        # candidatos: BGE-M3, multilingual-e5, EmbeddingGemma (ADR-004)
  query_prefix: ""            # multilingual-e5 requiere "query: " y "passage: "
  passage_prefix: ""

chunking:
  size_tokens: 300            # 300-600 (sección 6.2); se compara experimentalmente. Pequeño por el límite de 8k tokens/min de Groq
  overlap_pct: 12

retrieval:
  k: 5
  k_candidates: 20
  rrf_k: 60
  # Reordena los candidatos de la fusión con un cross-encoder.
  #   provider: local  -> modelo `model` en este equipo (lento en CPU, ~20 s). model: "" lo desactiva.
  #   provider: voyage -> API de Voyage AI (`voyage_model`), requiere VOYAGE_API_KEY en .env.
  #   provider: nvidia -> API de NVIDIA (`nvidia_model`), requiere NVIDIA_API_KEY en .env.
  #   Las dos APIs reciben la pregunta (ya redactada) y los fragmentos candidatos.
  reranker:
    provider: nvidia
    nvidia_model: "nvidia/nemotron-3.5-rerank-8b"   # multilingüe
    voyage_model: "rerank-2.5"   # rerank-2.5 | rerank-2.5-lite (multilingües); ver docs.voyageai.com/docs/reranker
    timeout_s: 15
    model: "BAAI/bge-reranker-v2-m3"
    candidates: 40            # cuántos candidatos de la fusión se reordenan (más = mejor y más lento)
    max_length: 256
    quantize_int8: true       # solo CPU: ~2x más rápido

sufficiency:
  relevance_threshold: 0.35   # PROVISIONAL: calibrar con el subconjunto dev (sección 7.2, paso 5)
  # Umbral sobre el puntaje del reranker, por modelo (cada uno tiene su escala). Si el reranker
  # en uso no aparece aquí, o su API falla, se usa relevance_threshold (similitud vectorial).
  # nvidia: 13 preguntas con respuesta (con erratas) dieron -1.12 a -2.79; 8 sin respuesta,
  # -2.78 a -3.41. PROVISIONAL: muestra pequeña, recalibrar con el subconjunto dev.
  rerank_threshold:
    "nvidia:nvidia/nemotron-3.5-rerank-8b": -2.9
  ignore_entities: ["LISTI", "UV"]

pipeline:
  max_query_chars: 500
  history_turns: 4
  max_insufficient_before_handoff: 2
  verification_retries: 1     # si la respuesta trae cifras/claves sin respaldo, se pide una vez más

privacy:
  log_full_text: false        # RNF5: solo metadatos
  rate_limit:
    max_calls: 20
    window_s: 60

routing:
  out_of_scope_keywords: ["receta de cocina", "horoscopo", "criptomoneda"]

paths:
  structured_db: "data/structured/plan_estudios.db"
  manifest: "data/raw/manifest.yaml"
  chunks: "data/processed/chunks.jsonl"
  index_info: "data/processed/index_info.json"
  chroma_dir: "data/chroma"
  traces: "logs/traces.jsonl"
  sensitive_topics: "config/sensitive_topics.yaml"
